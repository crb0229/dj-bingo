<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ Bingo card</title><link rel="stylesheet" href="style.css">
</head><body class="player"><div class="wrap">
<div id="head"></div>
<div class="tabs" id="tabs"></div>
<div class="rname" id="rname"></div>
<div id="card"></div>
<div class="row" style="justify-content:center;margin-top:14px">
  <button id="bingo">BINGO!</button>
  <button class="alt" id="clear">Clear round</button>
  <a class="btn alt" href="index.html">Leave</a>
</div>
<p class="muted" style="text-align:center">Tap a square when you hear that song. Tap again to unmark.</p>
</div>
<div class="big-bingo" id="big">BINGO!<br>Card #<b id="bigno"></b><span id="bigr"></span><span style="font-size:1rem;font-weight:normal">Show this to the host. Tap to close.</span></div>
<script src="songs.js"></script><script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const p = parseCode(q.get('g'));
if (!p) location.href = 'index.html';
const { code, cats } = p;

// Card number: from the link, or picked at random once per game and remembered on this phone.
const numKey = 'djb_num_' + code;
const n = parseInt(q.get('n')) || parseInt(localStorage.getItem(numKey)) || (1 + Math.floor(Math.random() * 999));
localStorage.setItem(numKey, n);

const markKey = 'djb_marks_' + code + '_' + n;
const marks = JSON.parse(localStorage.getItem(markKey) || 'null') || cats.map(() => []);
let r = +(localStorage.getItem(markKey + '_r') || 0);

$('head').innerHTML = `<div class="cardno">Game ${code} &middot; card #<b>${n}</b></div>`;
$('tabs').innerHTML = cats.map((c, i) => `<button data-r="${i}">Round ${i + 1}</button>`).join('');
$('tabs').onclick = e => { if (e.target.dataset.r) { r = +e.target.dataset.r; draw(); } };

function draw() {
  const set = new Set(marks[r]);
  $('rname').textContent = `Round ${r + 1}: ${cats[r].name}`;
  $('card').innerHTML = cardHTML(cats[r], makeCard(code, cats[r], n, r), i => set.has(i));
  [...$('tabs').children].forEach((b, i) => b.className = i === r ? '' : 'alt');
  localStorage.setItem(markKey, JSON.stringify(marks));
  localStorage.setItem(markKey + '_r', r);
}
$('card').onclick = e => {
  const sq = e.target.closest('.sq'); if (!sq) return;
  const i = +sq.dataset.i, m = marks[r];
  m.includes(i) ? m.splice(m.indexOf(i), 1) : m.push(i); draw();
};
$('clear').onclick = () => { if (confirm('Clear your marks for this round?')) { marks[r] = []; draw(); } };
$('bingo').onclick = () => { $('bigno').textContent = n; $('bigr').textContent = 'Round ' + (r + 1); $('big').style.display = 'flex'; };
$('big').onclick = e => e.currentTarget.style.display = 'none';
draw();
</script>
</body></html>
